name: Dev Flow - FinancialHub

on:
  push:
    branches:
      - develop
      - '**/dev'

jobs:
  acknowledge-push:
    name: Detecção de push em branches de desenvolvimento
    runs-on: self-hosted

    steps:
      - name: Runner ativo e evento detectado
        run: echo "Push recebido na branch: ${{ github.ref_name }}. Runner está funcional."
